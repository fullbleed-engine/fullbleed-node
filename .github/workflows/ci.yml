name: Node integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build published engine and verify native output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: wasm32-wasip1
          components: rustfmt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo fmt --manifest-path engine/Cargo.toml --check
      - run: npm run build
      - run: npm test
      - run: npm run check:types
      - run: npm run verify:native
      - run: npm run example
      - run: npm run verify:pack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: npm run verify:text
      - name: Verify inline wrapping from the installed package
        run: |
          npm run render:inline
          npm run verify:inline
      - name: Compare installed font subsets with the retained 0.1.3 baseline
        run: |
          npm install --prefix output/font-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.1.3
          npm run render:fonts -- --package-root output/font-baseline-consumer/node_modules/fullbleed --out output/font-baseline
          npm run verify:fonts -- --evidence-root output/font-baseline --allow-legacy-metadata
          npm run render:fonts
          npm run verify:fonts -- --baseline output/font-baseline --reviewed-layout test/fixtures/inline-layout-2.5.10.json
      - name: Verify installed custom font families against explicit faces
        run: |
          npm run render:families
          npm run verify:families
      - uses: actions/upload-artifact@v4
        with:
          name: node-engine
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: |
            output/pack-verification/*.tgz
            output/pack-verification/package-info.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-native-evidence
          path: |
            output/native-verification/verification.json
            output/native-verification/**/*.pdf
            output/native-verification/**/*.png
            output/native-verification/**/input.html
            output/native-verification/**/style.css
            output/pack-verification/verification.json
            output/pack-verification/text-extraction.json
            output/font-baseline-consumer/package-lock.json
            output/font-baseline/
            output/font-subsets/
            output/font-families/
            output/inline-wrapping/
          retention-days: 7

  installed:
    name: Packed package (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: node-engine
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: node-package
          path: input
      - run: npm test
      - run: npm run check:types
      - run: npm run verify:pack -- --package-dir input
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-latest' && matrix.node == '22'
        with:
          python-version: '3.12'
      - name: Verify Unicode font evidence with Windows locale decoding
        if: matrix.os == 'windows-latest' && matrix.node == '22'
        env:
          PYTHONUTF8: '0'
        run: |
          python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
          npm run render:fonts
          npm run verify:fonts -- --reviewed-layout test/fixtures/inline-layout-2.5.10.json
          npm run render:families
          npm run verify:families
          npm run render:inline
          npm run verify:inline
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'windows-latest' && matrix.node == '22'
        with:
          name: node-windows-font-evidence
          path: |
            output/font-subsets/
            output/font-families/
            output/inline-wrapping/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-installed-${{ matrix.os }}-${{ matrix.node }}
          path: |
            output/pack-verification/verification.json
            output/pack-verification/**/*.pdf
            output/pack-verification/**/*.png
          retention-days: 7

  browser:
    name: Browser package (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: node-engine
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: node-package
          path: input
      - run: npm run verify:pack -- --package-dir input
      - run: npm run verify:browser:prepare
      - run: python -m pip install -r tools/browser-requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tools/check-browser.py --browser ${{ matrix.browser }} --label ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            output/browser-verification/prepared.json
            output/browser-verification/copy-assets.json
            output/browser-verification/*.pdf
            output/browser-verification/*.png
            output/browser-${{ matrix.browser }}-ci/
          retention-days: 14
