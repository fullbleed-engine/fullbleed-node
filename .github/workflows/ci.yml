name: Node integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build published engine and verify native output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: wasm32-wasip1
          components: rustfmt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo fmt --manifest-path engine/Cargo.toml --check
      - run: npm run build
      - run: npm test
      - run: npm run check:types
      - run: npm run verify:native
      - run: npm run example
      - run: node examples/render-queue.mjs
      - run: npm run verify:pack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
      - name: Read installed batch outputs and actual README examples independently
        run: python tools/verify-batches.py
      - name: Verify the packed Workers entry in local workerd
        run: |
          npm run verify:cloudflare
          python tools/verify-cloudflare.py
          npm run verify:cloudflare:starter
          python tools/verify-cloudflare-starter.py
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: npm run verify:text
      - run: python tools/verify-components.py
      - name: Verify the installed engine fixes against independent expectations
        run: |
          node tools/render-engine-regressions.mjs
          python tools/verify-engine-regressions.py
      - name: Verify clipped pagination and public failure controls
        run: |
          npm install --prefix output/pagination-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.8.0
          node tools/render-pagination.mjs --package-root output/pagination-baseline-consumer/node_modules/fullbleed --out output/pagination-baseline
          python tools/verify-pagination.py output/pagination-baseline --negative-control
          npm run render:pagination
          npm run verify:pagination
      - name: Verify table wrapping and the published failure controls
        run: |
          npm install --prefix output/table-wrapping-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.8.1
          node tools/render-table-wrapping.mjs --package-root output/table-wrapping-baseline-consumer/node_modules/fullbleed --out output/table-wrapping-baseline
          python tools/verify-table-wrapping.py output/table-wrapping-baseline --negative-control
          npm run render:tables
          npm run verify:tables -- --baseline output/table-wrapping-baseline
      - name: Verify generated quotations and the published failure control
        run: |
          npm install --prefix output/generated-quotes-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.8.2
          node tools/render-generated-quotes.mjs --package-root output/generated-quotes-baseline-consumer/node_modules/fullbleed --out output/generated-quotes-baseline
          python tools/verify-generated-quotes.py output/generated-quotes-baseline --negative-control
          npm run render:quotes
          npm run verify:quotes -- --baseline output/generated-quotes-baseline
      - name: Verify continuous text decorations and the published failure control
        run: |
          npm install --prefix output/text-decorations-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.8.3
          node tools/render-text-decorations.mjs --package-root output/text-decorations-baseline-consumer/node_modules/fullbleed --out output/text-decorations-baseline
          python tools/verify-text-decorations.py output/text-decorations-baseline --negative-control
          npm run render:decorations
          npm run verify:decorations -- --baseline output/text-decorations-baseline
      - name: Verify authored preformatted wrapping and its published failure control
        run: |
          npm install --prefix output/preformatted-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.8.5
          node tools/render-preformatted.mjs --package-root output/preformatted-baseline-consumer/node_modules/fullbleed --out output/preformatted-baseline
          python tools/verify-preformatted.py output/preformatted-baseline --negative-control
          npm run render:preformatted
          npm run verify:preformatted -- --baseline output/preformatted-baseline
      - name: Verify radial endpoint colors, stitching bounds and the public failure control
        run: |
          npm install --prefix output/radial-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.8.6
          node tools/render-radial-gradients.mjs --package-root output/radial-baseline-consumer/node_modules/fullbleed --out output/radial-baseline
          python tools/verify-radial-gradients.py output/radial-baseline --negative-control
          npm run render:radial
          npm run verify:radial -- --baseline output/radial-baseline
      - name: Verify hidden text and author display overrides in installed output
        run: |
          node tools/render-hidden-text.mjs
          python tools/verify-hidden-text.py
      - name: Verify SVG cascade and inset-shadow paint from the installed package
        run: |
          node tools/render-engine-paint.mjs
          python tools/verify-engine-paint.py
      - name: Verify inline wrapping from the installed package
        run: |
          npm run render:inline
          npm run verify:inline
      - name: Verify Standard 14 previews and the public blank-preview control
        run: |
          npm install --prefix output/standard-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.3.1
          npm run render:standard -- --package-root output/standard-baseline-consumer/node_modules/fullbleed --out output/standard-baseline --negative-control
          npm run verify:standard -- output/standard-baseline
          npm run render:standard
          npm run verify:standard -- --baseline output/standard-baseline
      - name: Compare installed font subsets with the retained 0.1.3 baseline
        run: |
          npm install --prefix output/font-baseline-consumer --ignore-scripts --no-audit --no-fund --save-exact fullbleed@0.1.3
          npm run render:fonts -- --package-root output/font-baseline-consumer/node_modules/fullbleed --out output/font-baseline
          npm run verify:fonts -- --evidence-root output/font-baseline --allow-legacy-metadata
          npm run render:fonts
          npm run verify:fonts -- --baseline output/font-baseline --reviewed-layout test/fixtures/inline-layout-2.5.46.json
      - name: Verify installed custom font families against explicit faces
        run: |
          npm run render:families
          npm run verify:families
      - uses: actions/upload-artifact@v4
        with:
          name: node-engine
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: |
            output/pack-verification/*.tgz
            output/pack-verification/package-info.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-native-evidence
          path: |
            output/native-verification/verification.json
            output/native-verification/**/*.pdf
            output/native-verification/**/*.png
            output/native-verification/**/input.html
            output/native-verification/**/style.css
            output/native-verification/**/records.json
            output/native-verification/**/result.json
            output/batch-verification/
            output/pack-verification/batch-tests.log
            output/pack-verification/installed-batches.log
            output/pack-verification/verification.json
            output/pack-verification/text-extraction.json
            output/pack-verification/queue-tests.log
            output/pack-verification/default-styles-tests.log
            output/pack-verification/named-fonts-tests.log
            output/pack-verification/named-fonts/
            output/default-styles/
            output/queue-verification/
            output/queued-invoices/
            output/font-baseline-consumer/package-lock.json
            output/font-baseline/
            output/font-subsets/
            output/font-families/
            output/inline-wrapping/
            output/standard-baseline-consumer/package-lock.json
            output/standard-baseline/
            output/standard-fonts/
            output/engine-regressions/
            output/hidden-text/
            output/engine-paint/
            output/pagination/
            output/pagination-baseline/
            output/pagination-baseline-consumer/package-lock.json
            output/table-wrapping/
            output/table-wrapping-baseline/
            output/table-wrapping-baseline-consumer/package-lock.json
            output/generated-quotes/
            output/generated-quotes-baseline/
            output/generated-quotes-baseline-consumer/package-lock.json
            output/text-decorations/
            output/preformatted-whitespace/
            output/radial-gradient-endpoints/
            output/text-decorations-baseline/
            output/text-decorations-baseline-consumer/package-lock.json
            output/preformatted-baseline/
            output/preformatted-baseline-consumer/package-lock.json
            output/radial-baseline/
            output/radial-baseline-consumer/package-lock.json
            output/component-verification/
            output/cloudflare-verification/
            output/cloudflare-starter-verification/
          retention-days: 7

  installed:
    name: Packed package (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: node-engine
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: node-package
          path: input
      - run: npm test
      - run: npm run check:types
      - run: npm run verify:pack -- --package-dir input
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-latest' && matrix.node == '22'
        with:
          python-version: '3.12'
      - name: Verify Unicode font evidence with Windows locale decoding
        if: matrix.os == 'windows-latest' && matrix.node == '22'
        env:
          PYTHONUTF8: '0'
        run: |
          python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
          npm run render:fonts
          npm run verify:fonts -- --reviewed-layout test/fixtures/inline-layout-2.5.46.json
          npm run render:families
          npm run verify:families
          npm run render:inline
          npm run verify:inline
          npm run render:standard
          npm run verify:standard
          node tools/render-engine-regressions.mjs
          python tools/verify-engine-regressions.py
          node tools/render-hidden-text.mjs
          python tools/verify-hidden-text.py
          node tools/render-engine-paint.mjs
          python tools/verify-engine-paint.py
          npm run render:pagination
          npm run verify:pagination
          npm run render:tables
          npm run verify:tables
          npm run render:quotes
          npm run verify:quotes
          npm run render:decorations
          npm run verify:decorations
          npm run render:preformatted
          npm run verify:preformatted
          npm run render:radial
          npm run verify:radial
          python tools/verify-components.py
          python tools/verify-batches.py
          npm run verify:cloudflare
          python tools/verify-cloudflare.py
          npm run verify:cloudflare:starter
          python tools/verify-cloudflare-starter.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'windows-latest' && matrix.node == '22'
        with:
          name: node-windows-font-evidence
          path: |
            output/font-subsets/
            output/font-families/
            output/inline-wrapping/
            output/standard-fonts/
            output/engine-regressions/
            output/hidden-text/
            output/engine-paint/
            output/pagination/
            output/pagination-baseline/
            output/pagination-baseline-consumer/package-lock.json
            output/table-wrapping/
            output/table-wrapping-baseline/
            output/table-wrapping-baseline-consumer/package-lock.json
            output/generated-quotes/
            output/generated-quotes-baseline/
            output/generated-quotes-baseline-consumer/package-lock.json
            output/text-decorations/
            output/preformatted-whitespace/
            output/radial-gradient-endpoints/
            output/text-decorations-baseline/
            output/text-decorations-baseline-consumer/package-lock.json
            output/preformatted-baseline/
            output/preformatted-baseline-consumer/package-lock.json
            output/radial-baseline/
            output/radial-baseline-consumer/package-lock.json
            output/component-verification/
            output/cloudflare-verification/
            output/cloudflare-starter-verification/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-installed-${{ matrix.os }}-${{ matrix.node }}
          path: |
            output/pack-verification/verification.json
            output/pack-verification/queue-tests.log
            output/pack-verification/default-styles-tests.log
            output/pack-verification/component-tests.log
            output/pack-verification/batch-tests.log
            output/pack-verification/installed-batches.log
            output/batch-verification/
            output/component-verification/
            output/default-styles/
            output/queue-verification/
            output/pack-verification/**/*.pdf
            output/pack-verification/**/*.png
          retention-days: 7

  browser:
    name: Browser package (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: node-engine
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: node-package
          path: input
      - run: npm run verify:pack -- --package-dir input
      - run: npm run verify:browser:prepare
      - run: python -m pip install -r tools/browser-requirements.txt
      - name: Use the reachable official Ubuntu mirrors
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              lines = path.read_text().splitlines()
              if any(line.startswith('https://archive.ubuntu.com/ubuntu') for line in lines):
                  path.write_text('\n'.join(line for line in lines if 'azure.archive.ubuntu.com' not in line) + '\n')
          PY
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 5
      - run: python tools/check-browser.py --browser ${{ matrix.browser }} --label ci
      - run: python tools/check-html-export.py --browser ${{ matrix.browser }} --label ci
      - run: python tools/verify-engine-regressions.py output/browser-${{ matrix.browser }}-ci --browser
      - run: python tools/verify-hidden-text.py output/browser-${{ matrix.browser }}-ci --browser
      - run: python tools/verify-engine-paint.py output/browser-${{ matrix.browser }}-ci --browser
      - run: python tools/verify-pagination.py output/browser-${{ matrix.browser }}-ci --browser
      - run: python tools/verify-table-wrapping.py output/browser-${{ matrix.browser }}-ci --browser
      - run: python tools/verify-generated-quotes.py output/browser-${{ matrix.browser }}-ci --browser
      - run: python tools/verify-text-decorations.py output/browser-${{ matrix.browser }}-ci --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            output/browser-verification/prepared.json
            output/browser-verification/copy-assets.json
            output/browser-verification/*.pdf
            output/browser-verification/*.png
            output/browser-${{ matrix.browser }}-ci/
            output/html-export-${{ matrix.browser }}-ci/
          retention-days: 14
