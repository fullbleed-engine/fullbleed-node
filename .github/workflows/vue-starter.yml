name: Vue starter

on:
  push:
    branches: [main]
    paths: ['examples/vue/**', 'tools/check-vue-starter.py', 'tools/prepare-vue-check.mjs', 'tools/browser-requirements.txt', 'tools/starter_standard_fonts.py', '.github/workflows/vue-starter.yml']
  pull_request:
    paths: ['examples/vue/**', 'tools/check-vue-starter.py', 'tools/prepare-vue-check.mjs', 'tools/browser-requirements.txt', 'tools/starter_standard_fonts.py', '.github/workflows/vue-starter.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Vue starter (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/vue/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/vue
      - run: npm run build
        working-directory: examples/vue
      - run: node tools/prepare-vue-check.mjs
      - run: python -m pip install -r tools/browser-requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tools/check-vue-starter.py --dist examples/vue/dist --out output/vue-${{ matrix.browser }} --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vue-starter-${{ matrix.browser }}
          path: |
            output/vue-baseline/
            output/vue-${{ matrix.browser }}/
          retention-days: 14
