name: Next.js PDF starter
on:
  pull_request:
    paths: ['examples/nextjs/**', '.github/workflows/nextjs.yml']
  push:
    branches: [main]
    paths: ['examples/nextjs/**', '.github/workflows/nextjs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nextjs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/nextjs
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/nextjs/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run preview:pdf
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-${{ matrix.os }}-${{ matrix.node }}
          path: |
            examples/nextjs/output/
            examples/nextjs/public/invoice.png
          retention-days: 14
